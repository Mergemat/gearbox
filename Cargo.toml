[workspace]
resolver = "2"
members = [
    "apps/cli", "apps/editor",
    "packages/engine", "packages/gbx", "packages/packs", "packages/search", "packages/trace", "packages/world",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
rust-version = "1.99"
repository = "https://github.com/Mergemat/gearbox"
homepage = "https://github.com/Mergemat/gearbox"
authors = ["Bagautdin Omarov"]

[workspace.lints.clippy]
neg_cmp_op_on_partial_ord = "allow"
neg_multiply = "allow"
if_same_then_else = "allow"
approx_constant = "allow"
excessive_precision = "allow"
implicit_saturating_sub = "allow"
should_implement_trait = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
needless_range_loop = "allow"
large_enum_variant = "allow"
single_range_in_vec_init = "allow"
unnecessary_unwrap = "allow"
needless_late_init = "allow"
unnecessary_sort_by = "allow"
field_reassign_with_default = "allow"
len_without_is_empty = "allow"

[profile.release]
debug = 1

[profile.fast]
inherits = "release"
lto = "fat"
codegen-units = 1
