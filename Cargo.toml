[workspace]
resolver = "2"
members = [
    "apps/cli", "apps/editor",
    "packages/engine", "packages/gbx", "packages/packs", "packages/search", "packages/trace", "packages/world",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[profile.release]
debug = 1

[profile.fast]
inherits = "release"
lto = "fat"
codegen-units = 1
