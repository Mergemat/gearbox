name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0 or 0.2.0-rc.1"
        required: true
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - Cargo.lock
      - apps/editor/src/bundle.rs

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-14
            packages: --workspace
          - os: ubuntu-latest
            packages: --workspace --exclude gearbox-editor
          - os: windows-latest
            packages: --workspace --exclude gearbox-editor
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --locked ${{ matrix.packages }}

  prepare:
    name: Version
    needs: test
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      tag: ${{ steps.ref.outputs.tag }}
      publish: ${{ steps.ref.outputs.publish }}
      prerelease: ${{ steps.ref.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
      - name: Bump, commit and tag
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "not a version: $VERSION"; exit 1; }
          sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" Cargo.toml
          cargo update --workspace
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet || git commit -am "chore(release): v$VERSION"
          git tag "v$VERSION"
          git push origin HEAD:main "v$VERSION"
      - name: Pick the ref
        id: ref
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then tag="v$VERSION"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"
          else tag=""; fi
          if [ -n "$tag" ]; then
            echo "ref=$tag" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            [[ "$tag" == *-* ]] && echo "prerelease=true" >> "$GITHUB_OUTPUT" || echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "tag=dev" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            app: true
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build the CLI
        run: cargo build --release --locked --target ${{ matrix.target }} -p gearbox-cli
      - name: Package the CLI
        run: |
          name="gearbox-$TAG-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp LICENSE "dist/$name/"
          if [ "${{ runner.os }}" = Windows ]; then
            cp "target/${{ matrix.target }}/release/gearbox.exe" "dist/$name/"
            (cd dist && 7z a -tzip "$name.zip" "$name" > /dev/null)
          else
            cp "target/${{ matrix.target }}/release/gearbox" "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          fi
          rm -rf "dist/$name"
      - name: Build Gearbox.app
        if: matrix.app
        run: |
          cargo build --release --locked --target ${{ matrix.target }} -p gearbox-editor
          "target/${{ matrix.target }}/release/gearbox-editor" bundle --out dist
          ditto -c -k --keepParent dist/Gearbox.app "dist/Gearbox-$TAG-macos-arm64.zip"
          rm -rf dist/Gearbox.app
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  publish:
    name: Publish
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: orhun/git-cliff-action@v4
        with:
          args: --latest --strip header
        env:
          OUTPUT: NOTES.md
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          body_path: NOTES.md
          files: dist/*
