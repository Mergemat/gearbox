name: Bug
description: Something doesn't work or doesn't match the game
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Commands, and the map or replay if you can share it (TMX link or attachment).
  - type: input
    id: version
    attributes:
      label: Version
      description: Release version or commit.
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [macOS, Windows, Linux]
